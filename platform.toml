[project]
name = "stackin-node-sdk"
type = "library"
language = "node"
ci = "github"

[source_host]
kind = "github"
repo = "stackin-io/stackin-node-sdk"

[release]
strategy = "semver"
changelog = "conventional"

[[scopes]]
name = "prod"
kind = "library"
criticality = "high"

[[deploy.targets]]
name = "npm"
kind = "npm"
run_by = "github_actions"
observe = true
workflow = "npm-publish.yml"
stages = ["prod"]
package = "@stackin-io/stackin-node-sdk"
