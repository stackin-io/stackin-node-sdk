name: Setup Node
description: Setup Node.js with npm caching and dependency install

inputs:
  node-version:
    description: Node.js version to use
    required: true
  install-deps:
    description: Whether to install dependencies (any non-empty string enables)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 🟢 Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: ⚙️ Install dependencies
      if: inputs.install-deps != ''
      shell: bash
      run: npm ci
