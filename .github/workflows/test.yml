# Shared shape for every stackin-io SDK's test workflow.
# Reference implementation: stackin-python-sdk's real
# .github/workflows/test.yml. Fill in every {PLACEHOLDER}, then delete
# this header comment. Unit tests are not optional — see tests/README.md.

name: 🧪 Tests

on:
  pull_request:
    branches: ["main", "master"] # match this repo's real branches only
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        {LANG}-version: [{every actively-supported version, oldest-to-newest — same list as code-quality.yml's matrix}]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup {TOOLCHAIN}
        uses: ./.github/actions/setup-{toolchain}
        with:
          {LANG}-version: ${{ matrix.{LANG}-version }}
          install-deps: dev

      - name: 🧪 Run tests with coverage
        run: {test command with coverage — e.g. `pytest tests/ -v --cov`, `go test ./... -v -cover`}

      - name: ✅ Test Summary
        if: always()
        run: |
          echo "### Tests Completed ✅" >> $GITHUB_STEP_SUMMARY
          echo "{LANG} Version: ${{ matrix.{LANG}-version }}" >> $GITHUB_STEP_SUMMARY
