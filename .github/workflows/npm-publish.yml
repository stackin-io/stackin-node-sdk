name: 📦 Package NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to publish, without the v prefix
        required: true
        type: string
      registry:
        description: npm or npm-next
        required: true
        type: choice
        options: [npm, npm-next]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  code-quality:
    name: Code Quality Checks
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  integration:
    name: Issue a real document
    needs: [test, code-quality]
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  deploy:
    name: Deploy to NPM
    needs: [test, code-quality, integration]
    runs-on: ubuntu-latest
    environment: workflow

    steps:
      - name: 📥 Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: 🔍 Verify version matches tag
        shell: bash
        run: |
          EXPECTED="${{ inputs.version }}"
          ACTUAL=$(node -p "require('./package.json').version")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Version mismatch: package.json=$ACTUAL, tag=$EXPECTED"
            exit 1
          fi
          LAST=$(cat LAST_VERSION | tr -d '[:space:]')
          if [ "$EXPECTED" != "$LAST" ]; then
            echo "Version mismatch: LAST_VERSION=$LAST, tag=$EXPECTED"
            exit 1
          fi
          echo "Version OK: $EXPECTED"

      - name: 📦 Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: "20"
          install-deps: "true"

      - name: 🔨 Build package
        run: npm run build

      - name: 📤 Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          if [ "${{ inputs.registry }}" = "npm-next" ]; then
            npm publish --access public --tag next --provenance
          else
            npm publish --access public --provenance
          fi
